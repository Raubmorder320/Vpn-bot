services:
  api:
    build: ./api
    container_name: vpn_api
    restart: always
    env_file: .env
    environment:
      - CONFIG_PATH=/etc/xray/config.json
      - CONFIG_TEMPLATE=/etc/xray/config.example.json
      - DATA_DIR=/app/data
      - XRAY_API=xray:10085
    volumes:
      - ./xray:/etc/xray
      - ./data:/app/data
      - /var/lib/vnstat:/var/lib/vnstat:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vpn_net

  xray:
    image: teddysun/xray:latest
    container_name: xray
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./xray:/etc/xray:ro
    networks:
      - vpn_net

  bot:
    build: ./bot
    container_name: vpn_bot
    restart: always
    env_file: .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - vpn_net

networks:
  vpn_net:
    driver: bridge